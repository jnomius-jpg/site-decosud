# Met le site en ligne sur GitHub Pages à chaque modification de la branche main.
# Réglage nécessaire une seule fois : Settings > Pages > Source = « GitHub Actions ».
name: Mise en ligne du site

on:
  push:
    branches: [main]
  workflow_dispatch:   # bouton « Run workflow » pour relancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; une nouvelle remplace celle qui attend.
concurrency:
  group: mise-en-ligne
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
